 overloadDevice:{result:['Posible sobreconsumo o calentamiento del circuito','La protección dispara después de un periodo de funcionamiento.','Reduce la consumo y deja descansar el circuito. Si ocurre con un solo aparato o con un consumo normal, solicita revisión.','🟠 Revisión recomendada'],steps:['Apaga los aparatos de mayor potencia de esa zona.','Rearma la protección una sola vez cuando el circuito esté sin consumo elevado.','Vuelve a conectar los equipos de uno en uno.','Si vuelve a disparar con un consumo normal, deja de usar el circuito y pide revisión.']},
 overloadLikely:{result:['Probable exceso de potencia demandada','El corte coincide con varios consumidores de alta potencia funcionando simultáneamente. En España, el control de potencia del contador puede actuar cuando se supera la potencia contratada.','Primero reduce el consumo y recupera el suministro siguiendo el procedimiento seguro de volver a subir. Si ocurre con frecuencia, revisa la potencia contratada.','🟡 Recuperación guiada'],steps:['Apaga o desenchufa varios equipos de alta potencia.','Baja el interruptor general del cuadro, espera unos segundos y vuelve a subirlo.','Si vuelve la luz, conecta los aparatos de forma gradual y evita simultanear varios consumos altos.','Si vuelve a cortar con poca consumo, no asumas que es potencia: inicia un nuevo diagnóstico.','Si ocurre a menudo, consulta la potencia contratada y la potencia realmente utilizada antes de solicitar un aumento.']},
 leak:{result:['Posible fuga de corriente en la instalación o en algún equipo','El diferencial dispara sin un aparato concreto identificado.','No desmontes nada. Desconecta solo aparatos accesibles y sospechosos; si el diferencial continúa disparándose, deja de volver a subirlo y solicita un electricista cualificado.','🔴 Técnico recomendado'],steps:['Desconecta de forma normal los aparatos que puedas identificar como sospechosos.','Rearma el diferencial una sola vez si no hay ninguna señal de peligro.','Si se mantiene, no conectes de nuevo los aparatos sospechosos hasta revisarlos.','Si vuelve a disparar incluso con los aparatos desconectados, deja de hacer pruebas y solicita revisión profesional.']},
 suspectDevice:{result:['Posible problema relacionado con un aparato','El comportamiento comenzó después de conectar un equipo concreto.','Deja ese equipo desconectado y comprueba si la vivienda recupera estabilidad. No abras el aparato.','🟠 Revisión recomendada'],steps:['Desconecta el aparato sospechoso de la toma.','Rearma la protección una sola vez si no hay riesgo.','Si la instalación funciona, no vuelvas a conectar el aparato hasta revisarlo.','Si la protección vuelve a disparar sin él, revisa el circuito con un profesional.']},
 recoveredZone:{result:['La protección se había disparado y el suministro se recuperó','El interruptor vuelve a mantenerse arriba y la electricidad ha regresado.','Puedes continuar, pero observa si el fallo se repite. Si vuelve a ocurrir, no hagas hacerlo repetidamente: hay que encontrar la causa.','🟢 Suministro recuperado'],steps:['Mantén desconectados durante unos minutos los aparatos que estaban funcionando cuando ocurrió el corte.','Conecta los equipos uno por uno para identificar si alguno provoca el problema.','Si todo funciona, no hace falta desmontar nada.','Si el mismo interruptor vuelve a disparar, inicia otro diagnóstico y no lo fuerces.']},
 circuitFault:{result:['Fallo persistente en un circuito','La protección vuelve a dispararse inmediatamente o no se puede recuperar el servicio de forma estable.','No fuerces la protección. Deja desconectados los aparatos de la zona y solicita revisión por un electricista cualificado.','🔴 Técnico recomendado'],steps:['No sigas subiendo el mismo interruptor repetidamente.','Deja apagados/desconectados los equipos de la zona.','No desmontes enchufes, cajas ni cables.','Solicita revisión del circuito y de los aparatos conectados.']},
 zoneFault:{result:['Fallo localizado en una zona de la vivienda','Una zona ha perdido servicio sin una causa externa clara.','Revisa únicamente las protecciones accesibles del cuadro. Si están arriba y la zona sigue sin servicio, el circuito necesita revisión.','🟠 Revisión recomendada'],steps:['Comprueba visualmente si el automático de esa zona está bajado.','Si está bajado y no hay señales de peligro, puedes intentar volver a subirlo una vez.','Si vuelve a bajar, déjalo abajo y solicita revisión.','Si permanece arriba pero la zona sigue sin funcionar, no desmontes mecanismos: pide revisión del circuito.']},
 singleOutlet:{result:['Posible fallo localizado en un enchufe','Otros puntos funcionan y el problema parece concentrado en una sola toma.','No desmontes el enchufe. Comprueba solo si el aparato funciona en otra toma segura; si el problema sigue localizado, solicita revisión.','🟠 Revisión recomendada'],steps:['Desconecta el aparato de ese enchufe.','Si el aparato funciona en otra toma segura, el enchufe original queda como sospechoso.','No desmontes la toma ni toques conductores.','Si el enchufe está caliente, quemado, suelto o huele a quemado, no lo uses y pide asistencia.']},
 outletCircuit:{result:['Posible fallo del circuito de tomas','Varios enchufes de la misma zona están afectados.','Comprueba el automático correspondiente sin desmontar nada. Si está arriba y las tomas siguen sin funcionar, el circuito necesita revisión.','🔴 Técnico recomendado'],steps:['Desconecta los aparatos de las tomas afectadas.','Comprueba visualmente el cuadro.','Si el automático está bajado y no hay peligro, intenta volver a subirlo una sola vez.','Si vuelve a bajar o las tomas siguen sin corriente, deja de hacer pruebas y solicita revisión.']},
 oneLightFlicker:{result:['Posible fallo localizado en iluminación','El síntoma se limita a un punto de luz.','Si el parpadeo persiste, no desmontes la luminaria ni el interruptor. Puede ser una conexión, lámpara o equipo defectuoso.','🟠 Revisión recomendada'],steps:['Apaga la luz y deja que la luminaria se enfríe.','Si es una bombilla reemplazable y el cambio es una tarea que puedes realizar de forma segura, corta la alimentación antes de manipularla.','Si el parpadeo continúa con otra lámpara o no puedes identificar el problema, solicita revisión.']},
 manyFlicker:{result:['Posible problema de alimentación o conexión','Varias luces presentan el mismo comportamiento, lo que puede apuntar a una causa común.','No desmontes la instalación. Si el parpadeo es intenso, aparece en varias zonas o coincide con otros síntomas, solicita revisión profesional.','🔴 Técnico recomendado'],steps:['Observa si el parpadeo afecta a varias habitaciones.','No manipules el cuadro ni conexiones internas para intentar corregirlo.','Reduce aparatos de consumo alto si el problema aparece al conectar equipos potentes.','Si persiste, solicita revisión de la instalación o del suministro.']},
 lightSudden:{result:['Posible fallo localizado en iluminación','La iluminación dejó de funcionar de forma repentina mientras otros servicios pueden seguir funcionando.','Comprueba el cuadro sin desmontar nada. Si la protección está correcta y la luz sigue sin funcionar, solicita revisión del punto de luz.','🟠 Revisión recomendada'],steps:['Comprueba si otras luces de la vivienda funcionan.','Mira si el automático de iluminación está bajado.','Si está bajado y no hay señales de peligro, intenta volver a subirlo una sola vez.','Si vuelve a bajar o la luz no funciona, no desmontes la instalación.']},
 distributorHelp:{result:['Necesitas comprobar el contador o el suministro','El cuadro no muestra una protección clara y el suministro no se recupera con un procedimiento seguro.','No manipules el contador. Contacta con la distribuidora para que compruebe el estado del suministro y del control de potencia.','🟠 Distribuidora'],steps:['Mantén apagados los consumos altos.','No abras ni manipules el contador.','Contacta con la distribuidora por su canal oficial de averías o atención.','Si la distribuidora confirma que el suministro está correcto, solicita revisión de la instalación interior.']},
 tripUnclear:{result:['No se puede confirmar que sea solo un sobreconsumo','El corte no coincide claramente con varios consumos altos.','No sigas rearmando sin identificar qué protección actúa. Inicia el diagnóstico desde el cuadro o solicita revisión si se repite.','🟠 Revisión recomendada'],steps:['Desconecta aparatos de consumo alto.','Observa qué protección actúa si vuelve a ocurrir, sin tocar cables.','Si el mismo circuito vuelve a disparar, deja de volver a subirlo repetidamente.','Solicita revisión si no se identifica una causa sencilla y segura.']},
 tech:{result:['No hay información suficiente para una solución segura','Las respuestas no permiten diferenciar la causa sin inspección o mediciones.','No manipules cables, enchufes, el interior del cuadro ni el contador. Te conviene un electricista cualificado.','🔴 Técnico recomendado'],steps:['Deja la zona afectada sin manipular.','Desconecta aparatos sospechosos solo si puedes hacerlo normalmente y sin riesgo.','No puentes protecciones ni desmontes mecanismos.','Solicita revisión profesional y utiliza el informe de ElectroIA para explicar lo ocurrido.']}

function diagIllustration(n){

function voice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function requestVision(url,name,question){
  add('🔎 '+question,true);
  add('<div class="chat-typing-v3"><i></i><i></i><i></i></div>');

}
async function sendText(t){
  add(esc(t),true);
  add('<div class="chat-typing-v3"><i></i><i></i><i></i></div>');
  const c=document.getElementById('chat');
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),30000);
    const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,mode:currentMode}),signal:controller.signal});
    clearTimeout(timer);
    const raw=await r.text();
    let j={};
    try{j=JSON.parse(raw)}catch(_){j={error:raw||'Respuesta no válida del servidor.'}}
    const typing=c?.lastElementChild;
    const b=typing?.querySelector('.chat-msg-bubble');
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    if(b){const answer=j.answer||j.message||'No pude responder.';b.innerHTML=esc(answer)+`<br><button class="diag-audio" onclick='diagSpeak(${JSON.stringify(answer)})'>🔊 Escuchar</button>`+(diagIllustration({q:answer})||'');}
    if(typing?.querySelector('.chat-msg-meta'))typing.querySelector('.chat-msg-meta').textContent='ElectroIA · ahora';
  }catch(e){
    const typing=c?.lastElementChild;
    const b=typing?.querySelector('.chat-msg-bubble');
    if(b)b.innerHTML='No pude conectar con la IA en este momento. Podés usar <b>Diagnóstico de averías</b> para que ElectroIA te guíe paso a paso mientras revisamos la conexión del servidor.';
    if(typing?.querySelector('.chat-msg-meta'))typing.querySelector('.chat-msg-meta').textContent='ElectroIA · conexión';
  }
  if(c)c.scrollTop=c.scrollHeight;
}

/* Resultado final más explicativo: muestra el razonamiento sin afirmar una certeza que no puede verificarse a distancia. */
const _renderDiagOriginal=renderDiag;
renderDiag=function(){
  _renderDiagOriginal();
  const n=diagTree[diag.node];
  if(!n?.result)return;
  const box=document.querySelector('.eia-result');
  if(!box || box.querySelector('.diag-deep-note'))return;
  const answered=diag.answers.length;
  const note=document.createElement('div');
  note.className='diag-deep-note';
  note.style.cssText='margin-top:12px;padding:11px 12px;border-radius:12px;background:#f7f8fa;border:1px solid #e3e6ea;color:#4e5862;font-size:13px;line-height:1.45';
  note.innerHTML='<b>🔎 Cómo llegamos a esto</b><br>ElectroIA ha usado '+answered+' respuesta'+(answered===1?'':'s')+' para acotar el problema. El resultado es una hipótesis orientativa, no una certeza: una comprobación profesional puede confirmar la causa.';
  box.insertBefore(note,box.querySelector('small'));
};

<script id="electroia-spa-navigation">
let electroView='home';
let electroStack=[];
let electroGoingBack=false;

function enterView(name, reset=false){
  if(reset){
    electroStack=[];
    electroView=name;
    return;
  }
  if(electroGoingBack){
    electroView=name;
    return;
  }
  if(electroView!==name){
    electroStack.push(electroView);
    electroView=name;
  }
}

function goBack(){
  if(electroStack.length===0){
    return home();
  }
  const prev=electroStack.pop();
  electroGoingBack=true;
  electroView=prev;
  try{
    if(prev==='home') home();
    else if(prev==='hogar') hogar();
    else if(prev==='diagnostico') diagnostico();
    else if(prev==='safety') safety();
    else if(prev==='acciones') acciones();
    else if(prev==='consumo') consumo();
    else if(prev==='miCasa') miCasa();
    else if(prev==='cuadro') cuadro();
    else if(prev==='aprender') aprender();
    else if(prev==='prof') prof();
    else if(prev==='pv') pv();
    else if(prev==='projects') projects();
    else if(prev==='favorites') favorites();
    else if(prev==='settings') settings();
    else if(prev==='chat') chat(currentMode||'hogar');
    else home();
  } finally {
    electroGoingBack=false;
  }
}

// Inicializar la aplicación después de declarar el sistema de navegación.
window.electroView = electroView;
home();
</script>
<script id="electroia-diagnostico-v62">
/* V7.0 — Confirmación conversacional antes del diagnóstico final */
const _renderDiagV61 = renderDiag;

function diagNeedsConfirmation(node){
  const n=diagTree[node];
  if(!n?.result) return false;
  if(diag.confirmedNode===node) return false;
  if(n.result[3]?.startsWith('🔴')) return false; // seguridad no se retrasa
  return diag.answers.length>=2;
}

renderDiag=function(){
  const n=diagTree[diag.node];
  if(n?.result && diagNeedsConfirmation(diag.node)){
    renderDiagConfirmation();
    return;
  }
  _renderDiagV61();
};

function renderDiagConfirmation(){
  const n=diagTree[diag.node];
  const title=n.result?.[0]||'Posible causa';
  const why=n.result?.[1]||'';
  const answers=diag.answers.slice(-4).map(x=>`<div style="margin:7px 0"><b>${esc(x.q)}</b><br><span style="color:#687480">${esc(x.a)}</span></div>`).join('');
  const body=`<div class="eia-modern">
    <div class="eia-head"><div class="eia-avatar">⚡</div><div><b>ElectroIA</b><small>Última comprobación</small></div><span class="eia-online">● Analizando</span></div>
    <div class="eia-messages">
      <div class="eia-msg ai"><div class="eia-bubble">
        Antes de darte una conclusión, quiero comprobar una cosa más. Por tus respuestas, <b>parece que ${esc(title.toLowerCase())}</b>.
        <br><br>${esc(why)}
        <br><br><b>Esto es lo que entendí de tu caso:</b>
        <div style="margin-top:8px;padding:10px;border-radius:12px;background:#f7f8fa;border:1px solid #e3e6ea">${answers}</div>
        <br>¿Esto describe bien lo que está pasando?
      </div></div>
    </div>
    <div class="eia-quick">
      <button class="eia-start" onclick="diagConfirm(true)">✅ Sí, eso es lo que pasa</button>
      <button class="eia-back" onclick="diagConfirm(false)">❌ No exactamente</button>
      <button class="eia-back" onclick="diagCorrect()">✏️ Quiero corregir una respuesta</button>
    </div>
  </div>`;
  app.innerHTML=head(true)+`<main class="wrap page">${body}</main>`;
}

function diagConfirm(ok){
  if(ok){
    diag.confirmedNode=diag.node;
    diag.answers.push({q:'¿Esto describe bien lo que está pasando?',a:'Sí, eso es lo que pasa'});
    _renderDiagV61();
  }else{
    diag.answers.push({q:'¿Esto describe bien lo que está pasando?',a:'No exactamente'});
    diag.node='classify';
    if(!diagTree.classify)diagTree.classify={q:'Vamos a corregirlo. ¿Cuál de estas situaciones describe mejor el problema?',a:[
      ['No tengo luz en toda la vivienda','wholeHouse'],
      ['No tengo luz en una zona','zone'],
      ['Un aparato o enchufe no funciona','outlet'],
      ['Salta una llave del cuadro','protection'],
      ['Las luces parpadean','flicker'],
      ['No estoy seguro','tech']
    ]};
    renderDiag();
  }
}

function diagCorrect(){
  if(diag.history.length) {
    diagBack();
  } else {
    diag.node='start';
    renderDiag();
  }
}

/* Si el usuario confirma un resultado recuperado, hacemos una comprobación posterior. */
const _diagVerifyV61=diagVerify;
diagVerify=function(ok){
  if(ok){
    diag.confirmedNode=null;
    diag.answers.push({q:'¿La luz quedó funcionando de verdad?',a:'Sí, funciona'});
    addDiagConfirmation('Perfecto. La electricidad volvió y la situación parece estable. Antes de darlo por cerrado, recordá qué aparato o situación coincidió con el corte: si vuelve a ocurrir, ese dato será muy útil para encontrar la causa.');
  }else{
    _diagVerifyV61(false);
  }
};

/* Guardar el nodo confirmado cuando se inicia un diagnóstico nuevo. */
const _diagnosticoV61=diagnostico;
diagnostico=function(startNode='start',initialProblem=''){
  diag.confirmedNode=null;
  _diagnosticoV61(startNode,initialProblem);
};
</script>

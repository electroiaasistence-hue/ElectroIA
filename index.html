<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:"Segoe UI",Arial,sans-serif}body{padding-bottom:78px}.top{padding:18px 16px 14px;background:#000}.brand{font-size:34px;font-weight:300}.tag{font-size:14px;color:#ddd}.ver{color:#888;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center}.wrap{max-width:760px;margin:auto;padding:8px 10px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tile{border:0;color:#fff;min-height:142px;padding:16px;text-align:left;cursor:pointer;font-family:inherit}.tile.full{grid-column:1/-1}.tile.large{min-height:235px}.blue{background:#0879e8}.green{background:#10a84f}.orange{background:#f36b21}.yellow{background:#ffc107;color:#111}.red{background:#e51c3a}.purple{background:#6538c5}.teal{background:#08a7a7}.cyan{background:#00a8c6}.dark{background:#171717}.tile .ico{font-size:42px}.tile b{display:block;font-size:21px;font-weight:400;margin-top:8px}.tile span{display:block;font-size:14px;margin-top:6px;line-height:1.35}.arrow{float:right;font-size:28px;font-weight:200}.page{padding-bottom:20px}.page h1{font-size:29px;font-weight:300;margin:10px 4px 14px}.subtitle{color:#bbb;margin:0 4px 14px;line-height:1.45}.panel{background:#111;padding:15px;margin-bottom:7px}.panel h2{font-size:20px;font-weight:400;margin:0 0 7px}.panel p{color:#ccc;line-height:1.45}.btn{border:0;padding:12px 15px;background:#0879e8;color:#fff;font:inherit;cursor:pointer}.btn.alt{background:#333}.btn.warn{background:#e51c3a}.btn.light{background:#ffc107;color:#111}.choice{width:100%;border:0;background:#222;color:#fff;padding:14px;text-align:left;margin:4px 0;font:inherit;cursor:pointer}.choice strong{display:block;font-weight:400;font-size:17px}.choice small{display:block;color:#aaa;margin-top:4px}.risk{padding:13px;background:#261014;border-left:4px solid #e51c3a;margin:8px 0;line-height:1.4}.ok{padding:13px;background:#0d2415;border-left:4px solid #10a84f;margin:8px 0;line-height:1.4}.chat{height:410px;overflow:auto;background:#0d0d0d;padding:10px}.msg{padding:11px;margin:7px 0;background:#222;max-width:92%;line-height:1.45;white-space:pre-wrap}.msg.user{background:#0879e8;margin-left:auto}.chatrow{display:flex;gap:5px;margin-top:7px}.chatrow input{flex:1}.photo{max-width:100%;max-height:280px;display:block}.hidden{display:none}.progress{height:5px;background:#333;margin:8px 0}.progress i{display:block;height:100%;background:#0879e8;width:0}.list{padding-left:20px;color:#ccc;line-height:1.7}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#000;border-top:1px solid #333;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav{border:0;background:#000;color:#aaa;font:inherit}.nav.active{color:#0879e8}.nav .i{font-size:23px;display:block}@media(max-width:450px){.brand{font-size:30px}.tile.large{min-height:220px}.tile b{font-size:20px}}
</style>
<style id="electroia-chat-v3">
.chat-app{height:calc(100dvh - 112px);min-height:540px;display:flex;flex-direction:column;background:#f6f7f9;border:1px solid #e6e8ec;border-radius:28px;overflow:hidden;box-shadow:0 16px 45px rgba(0,0,0,.12)}
.chat-header{height:72px;flex:0 0 72px;display:flex;align-items:center;padding:10px 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid #e8eaee}
.chat-ai-avatar{width:44px;height:44px;border-radius:15px;background:#111;color:#fff;display:grid;place-items:center;font-size:21px}
.chat-head-copy{margin-left:10px}.chat-head-title{font-size:15px;font-weight:800;color:#16191e}.chat-head-sub{font-size:11px;color:#35a96d;margin-top:3px}.chat-head-sub:before{content:"";display:inline-block;width:6px;height:6px;background:#35b878;border-radius:50%;margin-right:5px}
.chat-head-action{margin-left:auto;width:38px;height:38px;border:0;border-radius:12px;background:#f0f1f3;color:#25292e;font-size:18px}
.chat-stream{flex:1;overflow-y:auto;padding:20px 14px 18px;display:flex;flex-direction:column;gap:13px;background:#f6f7f9;scroll-behavior:smooth}
.chat-msg{max-width:88%;display:flex;flex-direction:column;animation:chatin .2s ease-out}.chat-msg.user{align-self:flex-end;align-items:flex-end}.chat-msg.ai{align-self:flex-start;align-items:flex-start}
.chat-msg-bubble{padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 12px rgba(0,0,0,.045)}
.chat-msg.user .chat-msg-bubble{background:#111;color:#fff;border-bottom-right-radius:7px}.chat-msg.ai .chat-msg-bubble{background:#fff;color:#181b20;border:1px solid #e7e9ed;border-bottom-left-radius:7px}
.chat-msg-meta{font-size:9px;color:#9297a0;margin:4px 5px 0}.chat-welcome{text-align:center;margin:5px auto 14px;max-width:300px;color:#6e747d}.chat-welcome-icon{width:56px;height:56px;border-radius:19px;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:25px}.chat-welcome strong{display:block;color:#171a1f;font-size:18px;margin-bottom:5px}.chat-welcome span{font-size:12px;line-height:1.4}
.chat-suggestions{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 10px;background:rgba(255,255,255,.96);border-top:1px solid #eceef1;scrollbar-width:none}.chat-suggestions::-webkit-scrollbar{display:none}.chat-chip{white-space:nowrap;border:1px solid #dfe2e6;background:#fff;color:#333840;border-radius:999px;padding:8px 12px;font-size:12px}
.chat-composer{background:rgba(255,255,255,.97);backdrop-filter:blur(18px);padding:9px 11px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e8eaee}
.chat-input-wrap{display:flex;align-items:flex-end;gap:6px;background:#f7f8f9;border:1px solid #dfe2e6;border-radius:22px;padding:5px 5px 5px 12px}.chat-input-v3{flex:1;border:0;outline:0;background:transparent;resize:none;min-height:34px;max-height:110px;font:inherit;font-size:15px;color:#171a1e;padding:7px 0}.chat-input-v3::placeholder{color:#969ba3}
.chat-action{width:38px;height:38px;border:0;border-radius:14px;display:grid;place-items:center;font-size:17px;cursor:pointer}.chat-camera{background:transparent;color:#666}.chat-send-v3{background:#111;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.16)}
.chat-tools-v3{display:flex;gap:5px;padding:5px 3px 0}.chat-tool-v3{border:0;background:transparent;color:#777b83;border-radius:10px;padding:6px 8px;font-size:12px}
.chat-typing-v3{display:flex;gap:4px;align-items:center;padding:11px 14px;background:#fff;border:1px solid #e7e9ed;border-radius:19px;border-bottom-left-radius:7px}.chat-typing-v3 i{width:5px;height:5px;background:#7c8188;border-radius:50%;animation:chatdot 1s infinite}.chat-typing-v3 i:nth-child(2){animation-delay:.15s}.chat-typing-v3 i:nth-child(3){animation-delay:.3s}
@keyframes chatdot{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-3px);opacity:1}}@keyframes chatin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:600px){.chat-app{height:calc(100dvh - 102px);min-height:500px;border-radius:24px}.chat-msg{max-width:92%}.chat-msg-bubble{font-size:14.5px}}
</style></head>
<body>
<div id="app"></div>
<nav class="bottom">
<button class="nav active" id="nHome" onclick="home()">🏠<span>Inicio</span></button>
<button class="nav" id="nProjects" onclick="projects()">📁<span>Proyectos</span></button>
<button class="nav" id="nFav" onclick="favorites()">⭐<span>Favoritos</span></button>
<button class="nav" id="nSettings" onclick="settings()">⚙️<span>Ajustes</span></button>
</nav>
<script>
const API="/api";let currentMode="hogar",diag={step:0,answers:[]};
function head(back=false){return `<header class="top">${back?'<button class="btn alt" onclick="goBack()">← Volver</button>':''}<div class="row"><div><div class="brand">⚡ ElectroIA</div><div class="tag">Tu aliado eléctrico</div></div><div style="text-align:right">🏠<div class="ver">Hogar · v3.4</div></div></div></header>`}
function nav(id){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.add('active')}
function home(){electroStack=[];electroView='home';nav('nHome');app.innerHTML=head()+`<main class="wrap"><div class="panel" style="background:#0879e8"><h2>🏠 Modo Hogar</h2><p style="color:#fff;margin-bottom:12px">¿Qué está pasando? Contame el problema y te voy a guiar paso a paso.</p><button class="btn" style="background:#000" onclick="hogar()">Entrar en Modo Hogar →</button></div><div class="tiles"><button class="tile blue large" onclick="hogar()"><div class="ico">🏠</div><b>Modo Hogar</b><span>Problemas, instalaciones, consumo, seguridad y aprendizaje.</span></button><button class="tile green large" onclick="prof()"><div class="ico">🧰</div><b>Modo Profesional</b><span>Herramientas, cálculos, proyectos, FV y normativa.</span></button><button class="tile red" onclick="safety()"><div class="ico">⚠️</div><b>Seguridad</b><span>¿Hay humo, chispas, calor u olor a quemado?</span></button><button class="tile orange" onclick="chat('hogar')"><div class="ico">🎙️</div><b>Hablar con IA</b><span>Escribí, hablá o mandá una foto.</span></button></div></main>`}
function hogar(){enterView('hogar');nav('nHome');app.innerHTML=head(true)+`<main class="wrap page"><h1>🏠 Modo Hogar</h1><p class="subtitle">No necesitás saber electricidad. ElectroIA te hace las preguntas correctas y te acompaña.</p><div class="tiles"><button class="tile red large" onclick="diagnostico()"><div class="ico">🔴</div><b>Tengo un problema</b><span>Luces, enchufes, automáticos, diferencial, cortes, ruidos, calor o cualquier avería.</span><div class="arrow">→</div></button><button class="tile blue large" onclick="chat('hogar')"><div class="ico">🤖</div><b>¿Qué está pasando?</b><span>Contame con tus palabras. También podés hablar o mandar una foto.</span><div class="arrow">→</div></button><button class="tile orange" onclick="acciones()"><div class="ico">🔧</div><b>Quiero hacer algo</b><span>Lámparas, enchufes, interruptores y pequeñas tareas.</span></button><button class="tile yellow" onclick="consumo()"><div class="ico">💰</div><b>Mi consumo</b><span>Estimá consumo y coste de tus aparatos.</span></button><button class="tile teal" onclick="miCasa()"><div class="ico">🏡</div><b>Mi casa</b><span>Guardá datos útiles de tu vivienda.</span></button><button class="tile purple" onclick="aprender()"><div class="ico">💡</div><b>Quiero aprender</b><span>Electricidad explicada fácil.</span></button><button class="tile red full" onclick="safety()"><div class="ico">🛡️</div><b>Seguridad eléctrica</b><span>Qué hacer ante una situación potencialmente peligrosa.</span></button><button class="tile green full" onclick="projects()"><div class="ico">📁</div><b>Mis proyectos</b><span>Guardá y continuá reformas, instalaciones y tareas de casa.</span></button></div></main>`}
function diagnostico(){enterView('diagnostico');diag={step:1,answers:[]};renderDiag()}
function renderDiag(){let q='';if(diag.step===1)q=`<h1>🔎 Diagnóstico guiado</h1><p class="subtitle">Vamos de lo más importante a lo más específico. Si en algún momento hay peligro, paramos.</p><div class="panel"><h2>Pregunta 1 de 5</h2><p>¿Qué está pasando?</p><button class="choice" onclick="dNext('No tengo electricidad en toda la casa')"><strong>⚫ No tengo electricidad</strong><small>La casa está completamente sin luz.</small></button><button class="choice" onclick="dNext('Solo una parte de la casa no funciona')"><strong>🟡 Solo una parte</strong><small>Algunas luces o enchufes funcionan y otros no.</small></button><button class="choice" onclick="dNext('Un aparato o enchufe da problemas')"><strong>🔌 Un aparato o enchufe</strong><small>El problema parece localizado.</small></button><button class="choice" onclick="dNext('Hay olor, humo, chispas o calor')"><strong>🚨 Hay señales de peligro</strong><small>Olor a quemado, humo, chispas, calor o ruido fuerte.</small></button></div>`;else if(diag.step===2)q=`<h1>🔎 Diagnóstico guiado</h1><div class="progress"><i style="width:40%"></i></div><div class="panel"><h2>Pregunta 2 de 5</h2><p>¿Ves algún interruptor del cuadro eléctrico bajado respecto de los demás?</p><button class="choice" onclick="dNext('Sí, hay un interruptor bajado')"><strong>🟢 Sí</strong><small>Hay uno o varios abajo.</small></button><button class="choice" onclick="dNext('No, todos parecen arriba')"><strong>⚪ No</strong><small>Todos parecen estar en la misma posición.</small></button><button class="choice" onclick="dNext('No sé cómo mirarlo')"><strong>❓ No sé</strong><small>ElectroIA me puede ayudar a identificarlo.</small></button></div>`;else if(diag.step===3)q=`<h1>🔎 Diagnóstico guiado</h1><div class="progress"><i style="width:60%"></i></div><div class="panel"><h2>Pregunta 3 de 5</h2><p>¿El problema apareció después de conectar o encender algún aparato?</p><button class="choice" onclick="dNext('Sí, coincidió con un aparato')"><strong>🟢 Sí</strong></button><button class="choice" onclick="dNext('No, ocurrió sin conectar nada')"><strong>⚪ No</strong></button><button class="choice" onclick="dNext('No estoy seguro')"><strong>❓ No estoy seguro</strong></button></div>`;else if(diag.step===4)q=`<h1>🔎 Diagnóstico guiado</h1><div class="progress"><i style="width:80%"></i></div><div class="panel"><h2>Pregunta 4 de 5</h2><p>¿Hay olor a quemado, humo, chispas, partes calientes o cables expuestos?</p><button class="choice" onclick="dNext('Sí, hay una señal de peligro')"><strong>🚨 Sí</strong><small>No toques ni desmontes nada.</small></button><button class="choice" onclick="dNext('No hay señales de peligro')"><strong>🟢 No</strong></button></div>`;else q=`<h1>🔎 Diagnóstico guiado</h1><div class="progress"><i style="width:100%"></i></div><div class="panel"><h2>Última pregunta</h2><p>¿Querés que ElectroIA continúe el diagnóstico con IA usando tus respuestas?</p><button class="btn" onclick="diagToAI()">🤖 Continuar con IA</button><button class="btn alt" onclick="diagnostico()" style="margin-left:5px">Reiniciar</button></div>`;app.innerHTML=head(true)+`<main class="wrap page">${q}</main>`}
function dNext(a){diag.answers.push(a);diag.step++;renderDiag()}
function diagToAI(){let summary='Estoy haciendo un diagnóstico doméstico. Mis respuestas fueron:\n'+diag.answers.map((x,i)=>(i+1)+'. '+x).join('\n')+'\nGuiame con seguridad y haceme una pregunta por vez si necesitás más información.';chat('hogar',summary)}
function safety(){enterView('safety');nav('nHome');app.innerHTML=head(true)+`<main class="wrap page"><h1>⚠️ Seguridad eléctrica</h1><div class="risk"><b>Si hay humo, fuego, chispas, olor fuerte a quemado, una descarga, agua en contacto con electricidad o partes calientes:</b><br><br>no manipules cables ni desmontes equipos. Alejate y pedí asistencia. Cortá la alimentación solo si podés hacerlo sin exponerte.</div><div class="tiles"><button class="tile red" onclick="safetyAI('Hay humo o fuego')">🔥 Humo / fuego</button><button class="tile orange" onclick="safetyAI('Hay chispas')">⚡ Chispas</button><button class="tile yellow" onclick="safetyAI('Hay olor a quemado o algo caliente')">🌡️ Calor / olor</button><button class="tile blue" onclick="safetyAI('Hay agua cerca de electricidad')">💧 Agua + electricidad</button></div><div class="panel"><button class="btn" onclick="chat('hogar','Tengo una situación potencialmente peligrosa y necesito orientación de seguridad. No quiero manipular nada hasta saber qué hacer.')">🤖 Consultar a ElectroIA</button></div></main>`}
function safetyAI(t){chat('hogar','Situación de seguridad: '+t+'. Decime qué hacer de forma segura y qué NO debo tocar.')}
function acciones(){enterView('acciones');nav('nHome');app.innerHTML=head(true)+`<main class="wrap page"><h1>🔧 Quiero hacer algo</h1><p class="subtitle">Elegí qué querés hacer y ElectroIA te guía. Si la tarea requiere conocimientos o mediciones profesionales, te lo va a indicar.</p><button class="choice" onclick="chat('hogar','Quiero cambiar una lámpara o instalar una luz en casa.')"><strong>💡 Cambiar / instalar una luz</strong></button><button class="choice" onclick="chat('hogar','Quiero cambiar o instalar un interruptor.')"><strong>🔘 Interruptor</strong></button><button class="choice" onclick="chat('hogar','Quiero cambiar o instalar un enchufe.')"><strong>🔌 Enchufe</strong></button><button class="choice" onclick="chat('hogar','Quiero instalar un ventilador o pequeño equipo eléctrico.')"><strong>🌀 Ventilador / equipo</strong></button><button class="choice" onclick="chat('hogar','Quiero hacer otra tarea eléctrica en casa.')"><strong>➕ Otra tarea</strong></button></main>`}
function consumo(){enterView('consumo');nav('nHome');app.innerHTML=head(true)+`<main class="wrap page"><h1>💰 Mi consumo</h1><p class="subtitle">Podés empezar con una estimación sencilla. Después podemos convertirla en un inventario de tu casa.</p><div class="panel"><label>Aparato</label><input id="dev" placeholder="Ej.: termo eléctrico" style="width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin:6px 0 10px;font:inherit"><label>Potencia aproximada (W)</label><input id="watts" type="number" placeholder="Ej.: 1500" style="width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin:6px 0 10px;font:inherit"><label>Horas de uso al día</label><input id="hours" type="number" step="0.1" placeholder="Ej.: 3" style="width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin:6px 0 10px;font:inherit"><button class="btn" onclick="calcConsumption()">Calcular</button><div id="consResult"></div></div><button class="choice" onclick="chat('hogar','Quiero analizar el consumo eléctrico de mi casa y saber qué aparatos pueden estar gastando más.')"><strong>🤖 Analizar mi consumo con IA</strong><small>Te haré preguntas sobre tu vivienda y tus aparatos.</small></button></main>`}
function calcConsumption(){let w=+document.getElementById('watts').value,h=+document.getElementById('hours').value;if(!w||!h){document.getElementById('consResult').innerHTML='<p>Completá potencia y horas de uso.</p>';return}let d=w/1000*h,m=d*30;document.getElementById('consResult').innerHTML=`<div class="ok"><b>Estimación</b><br>${d.toFixed(2)} kWh/día<br>${m.toFixed(1)} kWh/mes<br><small>El coste en € depende de tu tarifa. Podés pedírselo a ElectroIA.</small></div>`}
function miCasa(){enterView('miCasa');nav('nHome');app.innerHTML=head(true)+`<main class="wrap page"><h1>🏡 Mi casa</h1><p class="subtitle">Guardaremos estos datos localmente en este prototipo para usarlos en futuras funciones.</p><div class="panel"><input id="homeName" placeholder="Nombre de la casa" style="width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin-bottom:7px;font:inherit"><input id="homeType" placeholder="Piso / casa / local" style="width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin-bottom:7px;font:inherit"><input id="power" placeholder="Potencia contratada (si la sabés)" style="width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin-bottom:7px;font:inherit"><input id="notes" placeholder="Notas: instalación antigua, cuadro, etc." style="width:100%;background:#000;color:#fff;border:1px solid #555;padding:12px;margin-bottom:7px;font:inherit"><button class="btn" onclick="saveHouse()">💾 Guardar</button><div id="savedHouse"></div></div></main>`}
function saveHouse(){let d={name:homeName.value,type:homeType.value,power:power.value,notes:notes.value};localStorage.setItem('electroia_house',JSON.stringify(d));document.getElementById('savedHouse').innerHTML='<div class="ok">Datos guardados en este dispositivo.</div>'}
function aprender(){enterView('aprender');nav('nHome');app.innerHTML=head(true)+`<main class="wrap page"><h1>💡 Quiero aprender</h1><button class="choice" onclick="learn('Explicame qué es el voltaje de forma sencilla.')"><strong>⚡ Voltaje</strong><small>Qué significa y dónde lo encontramos.</small></button><button class="choice" onclick="learn('Explicame qué es la corriente eléctrica de forma sencilla.')"><strong>🔄 Corriente</strong></button><button class="choice" onclick="learn('Explicame qué es un magnetotérmico y para qué sirve.')"><strong>🛡️ Magnetotérmico</strong></button><button class="choice" onclick="learn('Explicame qué es un diferencial y por qué protege a las personas.')"><strong>🛡️ Diferencial</strong></button><button class="choice" onclick="learn('Enseñame electricidad doméstica desde cero, con pequeñas lecciones.')"><strong>📚 Empezar desde cero</strong></button></main>`}
function learn(t){chat('hogar',t)}
function chat(mode='hogar',initial=''){enterView('chat');
currentMode=mode;nav('nHome');
app.innerHTML=head(true)+`<main class="wrap page"><div class="chat-app">
<div class="chat-header"><div class="chat-ai-avatar">⚡</div><div class="chat-head-copy"><div class="chat-head-title">ElectroIA</div><div class="chat-head-sub">Asistente eléctrico</div></div><button class="chat-head-action" onclick="clearChat()" title="Nueva conversación">＋</button></div>
<div class="chat-stream" id="chat"><div class="chat-welcome"><div class="chat-welcome-icon">⚡</div><strong>¿Qué está pasando?</strong><span>Contame el problema con tus palabras. Te voy a guiar paso a paso y priorizar la seguridad.</span></div>
<div class="chat-msg ai"><div class="chat-msg-bubble">Hola. Soy ElectroIA. ¿Qué problema eléctrico tenés en casa?</div><div class="chat-msg-meta">Ahora</div></div>
${initial?`<div class="chat-msg user"><div class="chat-msg-bubble">${esc(initial)}</div><div class="chat-msg-meta">Ahora</div></div>`:''}</div>
<div class="chat-suggestions"><button class="chat-chip" onclick="quickChat('Se me apagaron algunas luces')">💡 Se me apagaron luces</button><button class="chat-chip" onclick="quickChat('Me saltó el diferencial')">⚡ Saltó el diferencial</button><button class="chat-chip" onclick="quickChat('Un enchufe no funciona')">🔌 Enchufe sin corriente</button><button class="chat-chip" onclick="quickChat('Hay olor a quemado')">🚨 Olor a quemado</button></div>
<div class="chat-composer"><div class="chat-input-wrap"><textarea id="msg" class="chat-input-v3" rows="1" placeholder="Contame qué pasa…"></textarea><button class="chat-action chat-camera" onclick="pickPhoto()" title="Foto">📷</button><button class="chat-action chat-send-v3" onclick="send()" title="Enviar">↑</button></div>

<script id="electroia-spa-navigation">
let electroView='home';
let electroStack=[];
let electroGoingBack=false;

function enterView(name, reset=false){
  if(reset){
    electroStack=[];
    electroView=name;
    return;
  }
  if(electroGoingBack){
    electroView=name;
    return;
  }
  if(electroView!==name){
    electroStack.push(electroView);
    electroView=name;
  }
}

function goBack(){
  if(electroStack.length===0){
    return home();
  }
  const prev=electroStack.pop();
  electroGoingBack=true;
  electroView=prev;
  try{
    if(prev==='home') home();
    else if(prev==='hogar') hogar();
    else if(prev==='diagnostico') diagnostico();
    else if(prev==='safety') safety();
    else if(prev==='acciones') acciones();
    else if(prev==='consumo') consumo();
    else if(prev==='miCasa') miCasa();
    else if(prev==='aprender') aprender();
    else if(prev==='prof') prof();
    else if(prev==='pv') pv();
    else if(prev==='projects') projects();
    else if(prev==='favorites') favorites();
    else if(prev==='settings') settings();
    else if(prev==='chat') chat(currentMode||'hogar');
    else home();
  } finally {
    electroGoingBack=false;
  }
}
</script></body></html>

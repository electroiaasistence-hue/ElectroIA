 meterRemoteReset:{result:['Probable actuación del control de potencia del contador','Había varios consumos altos y el cuadro no mostraba una protección bajada. En España, el contador inteligente puede incorporar el control de potencia (ICP).','Mantén apagados/desconectados los consumos altos. Usa únicamente el procedimiento de reconexión que indique tu distribuidora para tu contador (en algunos suministros puede hacerse desde el área online). No abras ni manipules el contador. Si no reconecta, contacta con la distribuidora.','🟡 Recuperación guiada'],steps:['Apaga o desenchufa horno, vitro, termo, calefacción/estufas, aire acondicionado u otros equipos de alta potencia que estuvieran funcionando.','Rearma el cuadro solo desde sus interruptores accesibles: baja el general, espera unos segundos y vuelve a subirlo.','Si tu contador tiene un botón o procedimiento de reconexión indicado por el propio equipo o por tu distribuidora, sigue exactamente esa indicación; algunos modelos permiten una pulsación mantenida durante unos segundos. No existe un tiempo único válido para todos los contadores.','Una vez recuperada la luz, vuelve a conectar los aparatos de uno en uno y evita encender varios consumos altos simultáneamente.','Si el corte por potencia se repite con frecuencia, conviene revisar la potencia contratada y la instalación con la comercializadora/distribuidora o un profesional.']},
 powerRestored:{result:['Suministro recuperado tras reducir la carga','El corte coincidió con varios consumos importantes y la instalación volvió a funcionar después de reducir carga y rearmar el cuadro.','Puedes seguir usando la vivienda, pero evita volver a conectar todos los equipos de alta potencia a la vez. Si sucede con frecuencia, revisa la potencia contratada.','🟢 Resuelto'],steps:['Mantén apagados unos minutos los aparatos de mayor potencia.','Vuelve a conectarlos de forma gradual, uno por uno.','Evita simultanear varios consumos altos si la potencia contratada es limitada.','Si vuelve a cortarse aun con pocos aparatos conectados, inicia un nuevo diagnóstico: puede no ser solo potencia.']},
 meterNoTrip:{result:['Posible problema en contador, suministro o instalación','Toda la vivienda está sin luz, los vecinos sí tienen suministro y no aparece una protección bajada.','No manipules el contador. Comprueba que la instalación no tenga una protección oculta/disparada y, si todo parece normal, contacta con la distribuidora para comprobar el estado del suministro.','🟠 Comprobar suministro'],steps:['No abras ni desmontes el contador.','Comprueba visualmente el cuadro sin tocar cables: general, diferencial y automáticos deben estar en posición normal.','Si todo está arriba y sigues sin luz, contacta con la distribuidora para que compruebe el contador/suministro.','Si la distribuidora confirma que la red y el contador están bien, será necesario un instalador autorizado para revisar la instalación interior.']},
 networkOutage:{result:['Probable incidencia de red','También hay viviendas o zonas cercanas sin electricidad, por lo que el problema puede estar fuera de tu instalación.','No manipules el cuadro ni el contador para intentar solucionar una avería de red. Consulta el aviso de averías de tu distribuidora o comunícala si no aparece registrada.','🟠 Distribuidora'],steps:['Comprueba si vecinos, portal o calle están también sin suministro.','No hagas pruebas eléctricas dentro de casa para intentar recuperar una avería externa.','Consulta el canal de averías de tu distribuidora y comprueba si existe una incidencia registrada.','Si solo tu vivienda continúa sin luz cuando la zona ya ha recuperado el servicio, vuelve a diagnosticar la instalación interior.']},
 breakerWhole:{q:'¿Puedes ver cuál es el interruptor bajado sin desmontar nada?',a:[['Sí, veo el general/diferencial/automático bajado','breakerIdentify'],['No estoy seguro','tech']]},

 diffImmediate:{result:['Posible fuga de corriente asociada al aparato','El diferencial dispara inmediatamente al conectar ese equipo.','No uses ese aparato. Desenchúfalo solo si puedes hacerlo de forma normal y segura, sin tocar partes dañadas ni húmedas. No lo abras. Si al dejarlo desconectado el suministro se mantiene, el aparato queda identificado como sospechoso.','🔴 Técnico recomendado'],steps:['Deja el aparato sospechoso desconectado.','No lo abras, no cambies cables y no intentes puentear la protección.','Comprueba si la vivienda mantiene la luz con el aparato desconectado.','Si el diferencial sigue disparándose, no continúes rearmándolo: necesita revisión de la instalación.']},
 diffDelayed:{result:['Posible fuga o fallo que aparece durante el funcionamiento','El diferencial dispara después de un tiempo de uso.','Deja de utilizar el aparato cuando vuelva a ocurrir y no hagas pruebas internas. Si el resto de la vivienda funciona, el aparato queda como sospechoso.','🟠 Revisión recomendada'],steps:['Deja desconectado el aparato que coincide con el disparo.','Rearma la protección una sola vez si no existe ninguna señal de peligro.','Si la luz se mantiene, no vuelvas a usar ese aparato hasta revisarlo.','Si vuelve a disparar sin ese aparato conectado, pasa a revisión de la instalación.']},
 short:{result:['Posible cortocircuito o fallo interno del aparato','El automático dispara inmediatamente al encenderlo.','Deja el aparato desconectado. No sigas rearmando la protección con el equipo conectado. Si el circuito funciona sin él, el aparato es el principal sospechoso.','🔴 Técnico recomendado'],steps:['Desconecta el aparato de la toma si hacerlo es normal y seguro.','Rearma la protección una sola vez.','Si vuelve la luz y se mantiene, no conectes de nuevo el aparato.','Si el automático vuelve a bajar sin ese aparato, no sigas rearmándolo y solicita revisión.']},
 overloadDevice:{result:['Posible sobrecarga o calentamiento del circuito','La protección dispara después de un periodo de funcionamiento.','Reduce la carga y deja descansar el circuito. Si ocurre con un solo aparato o con una carga normal, solicita revisión.','🟠 Revisión recomendada'],steps:['Apaga los aparatos de mayor potencia de esa zona.','Rearma la protección una sola vez cuando el circuito esté sin carga elevada.','Vuelve a conectar los equipos de uno en uno.','Si vuelve a disparar con una carga normal, deja de usar el circuito y pide revisión.']},
 overloadLikely:{result:['Probable exceso de potencia demandada','El corte coincide con varios consumidores de alta potencia funcionando simultáneamente. En España, el control de potencia del contador puede actuar cuando se supera la potencia contratada.','Primero reduce la carga y recupera el suministro siguiendo el procedimiento seguro de rearme. Si ocurre con frecuencia, revisa la potencia contratada.','🟡 Recuperación guiada'],steps:['Apaga o desenchufa varios equipos de alta potencia.','Baja el interruptor general del cuadro, espera unos segundos y vuelve a subirlo.','Si vuelve la luz, conecta los aparatos de forma gradual y evita simultanear varios consumos altos.','Si vuelve a cortar con poca carga, no asumas que es potencia: inicia un nuevo diagnóstico.','Si ocurre a menudo, consulta la potencia contratada y la potencia realmente utilizada antes de solicitar un aumento.']},
 leak:{result:['Posible fuga de corriente en la instalación o en algún equipo','El diferencial dispara sin un aparato concreto identificado.','No desmontes nada. Desconecta solo aparatos accesibles y sospechosos; si el diferencial continúa disparándose, deja de rearmarlo y solicita un electricista cualificado.','🔴 Técnico recomendado'],steps:['Desconecta de forma normal los aparatos que puedas identificar como sospechosos.','Rearma el diferencial una sola vez si no hay ninguna señal de peligro.','Si se mantiene, no conectes de nuevo los aparatos sospechosos hasta revisarlos.','Si vuelve a disparar incluso con los aparatos desconectados, deja de hacer pruebas y solicita revisión profesional.']},
 suspectDevice:{result:['Posible problema relacionado con un aparato','El comportamiento comenzó después de conectar un equipo concreto.','Deja ese equipo desconectado y comprueba si la vivienda recupera estabilidad. No abras el aparato.','🟠 Revisión recomendada'],steps:['Desconecta el aparato sospechoso de la toma.','Rearma la protección una sola vez si no hay riesgo.','Si la instalación funciona, no vuelvas a conectar el aparato hasta revisarlo.','Si la protección vuelve a disparar sin él, revisa el circuito con un profesional.']},
 recoveredZone:{result:['La protección se había disparado y el suministro se recuperó','El interruptor vuelve a mantenerse arriba y la electricidad ha regresado.','Puedes continuar, pero observa si el fallo se repite. Si vuelve a ocurrir, no hagas rearmes repetidos: hay que encontrar la causa.','🟢 Suministro recuperado'],steps:['Mantén desconectados durante unos minutos los aparatos que estaban funcionando cuando ocurrió el corte.','Conecta los equipos uno por uno para identificar si alguno provoca el problema.','Si todo funciona, no hace falta desmontar nada.','Si el mismo interruptor vuelve a disparar, inicia otro diagnóstico y no lo fuerces.']},

 zoneFault:{result:['Fallo localizado en una zona de la vivienda','Una zona ha perdido servicio sin una causa externa clara.','Revisa únicamente las protecciones accesibles del cuadro. Si están arriba y la zona sigue sin servicio, el circuito necesita revisión.','🟠 Revisión recomendada'],steps:['Comprueba visualmente si el automático de esa zona está bajado.','Si está bajado y no hay señales de peligro, puedes intentar rearmarlo una vez.','Si vuelve a bajar, déjalo abajo y solicita revisión.','Si permanece arriba pero la zona sigue sin funcionar, no desmontes mecanismos: pide revisión del circuito.']},
 singleOutlet:{result:['Posible fallo localizado en un enchufe','Otros puntos funcionan y el problema parece concentrado en una sola toma.','No desmontes el enchufe. Comprueba solo si el aparato funciona en otra toma segura; si el problema sigue localizado, solicita revisión.','🟠 Revisión recomendada'],steps:['Desconecta el aparato de ese enchufe.','Si el aparato funciona en otra toma segura, el enchufe original queda como sospechoso.','No desmontes la toma ni toques conductores.','Si el enchufe está caliente, quemado, suelto o huele a quemado, no lo uses y pide asistencia.']},
 outletCircuit:{result:['Posible fallo del circuito de tomas','Varios enchufes de la misma zona están afectados.','Comprueba el automático correspondiente sin desmontar nada. Si está arriba y las tomas siguen sin funcionar, el circuito necesita revisión.','🔴 Técnico recomendado'],steps:['Desconecta los aparatos de las tomas afectadas.','Comprueba visualmente el cuadro.','Si el automático está bajado y no hay peligro, intenta rearmarlo una sola vez.','Si vuelve a bajar o las tomas siguen sin corriente, deja de hacer pruebas y solicita revisión.']},
 oneLightFlicker:{result:['Posible fallo localizado en iluminación','El síntoma se limita a un punto de luz.','Si el parpadeo persiste, no desmontes la luminaria ni el interruptor. Puede ser una conexión, lámpara o equipo defectuoso.','🟠 Revisión recomendada'],steps:['Apaga la luz y deja que la luminaria se enfríe.','Si es una bombilla reemplazable y el cambio es una tarea que puedes realizar de forma segura, corta la alimentación antes de manipularla.','Si el parpadeo continúa con otra lámpara o no puedes identificar el problema, solicita revisión.']},
 manyFlicker:{result:['Posible problema de alimentación o conexión','Varias luces presentan el mismo comportamiento, lo que puede apuntar a una causa común.','No desmontes la instalación. Si el parpadeo es intenso, aparece en varias zonas o coincide con otros síntomas, solicita revisión profesional.','🔴 Técnico recomendado'],steps:['Observa si el parpadeo afecta a varias habitaciones.','No manipules el cuadro ni conexiones internas para intentar corregirlo.','Reduce cargas altas si el problema aparece al conectar equipos potentes.','Si persiste, solicita revisión de la instalación o del suministro.']},
 lightSudden:{result:['Posible fallo localizado en iluminación','La iluminación dejó de funcionar de forma repentina mientras otros servicios pueden seguir funcionando.','Comprueba el cuadro sin desmontar nada. Si la protección está correcta y la luz sigue sin funcionar, solicita revisión del punto de luz.','🟠 Revisión recomendada'],steps:['Comprueba si otras luces de la vivienda funcionan.','Mira si el automático de iluminación está bajado.','Si está bajado y no hay señales de peligro, intenta rearmarlo una sola vez.','Si vuelve a bajar o la luz no funciona, no desmontes la instalación.']},
 distributorHelp:{result:['Necesitas comprobar el contador o el suministro','El cuadro no muestra una protección clara y el suministro no se recupera con un procedimiento seguro.','No manipules el contador. Contacta con la distribuidora para que compruebe el estado del suministro y del control de potencia.','🟠 Distribuidora'],steps:['Mantén apagados los consumos altos.','No abras ni manipules el contador.','Contacta con la distribuidora por su canal oficial de averías o atención.','Si la distribuidora confirma que el suministro está correcto, solicita revisión de la instalación interior.']},
 tripUnclear:{result:['No se puede confirmar que sea solo una sobrecarga','El corte no coincide claramente con varios consumos altos.','No sigas rearmando sin identificar qué protección actúa. Inicia el diagnóstico desde el cuadro o solicita revisión si se repite.','🟠 Revisión recomendada'],steps:['Desconecta cargas altas.','Observa qué protección actúa si vuelve a ocurrir, sin tocar cables.','Si el mismo circuito vuelve a disparar, deja de rearmarlo repetidamente.','Solicita revisión si no se identifica una causa sencilla y segura.']},

diagTree.danger={result:['Situación de riesgo eléctrico','Hay una señal compatible con descarga, incendio o contacto peligroso.','DETENÉ LAS PRUEBAS. Alejate de la zona. Si puedes cortar la alimentación sin exponerte, hazlo; no toques partes mojadas, calientes o dañadas. Solicita asistencia profesional y, si existe fuego o peligro inmediato, llama al servicio de emergencias.','🔴 DETENER · Emergencia'],steps:['No toques cables, enchufes, aparatos dañados ni partes mojadas.','No intentes rearmar una protección si hay humo, chispas, agua, calor anormal u olor fuerte a quemado.','Aléjate y corta la alimentación solo si el corte puede hacerse desde un lugar seguro.','Si hay incendio, humo importante o riesgo para personas, llama al 112.','Después, un profesional debe revisar la causa antes de volver a utilizar la instalación.']};
let diagAI={};
function diagnostico(startNode='start', initialProblem=''){enterView('diagnostico');diag={answers:[],history:[],problem:initialProblem||'',node:startNode||'start',risk:(startNode==='danger')};renderDiag()}
function renderDiag(){const n=diagTree[diag.node];if(!n){diag.node='tech';return renderDiag()}let body=`<div class="eia-modern"><div class="eia-head"><div class="eia-avatar">⚡</div><div><b>ElectroIA</b><small>Diagnóstico adaptativo · Hogar</small></div><span class="eia-online">● En línea</span></div><div class="eia-messages" id="diagMessages">`;body+=`<div class="eia-msg ai"><div class="eia-bubble">${esc(n.q||'He analizado tus respuestas.')} </div></div>`;body+=`</div><div class="eia-quick">`;
if(n.result){const danger=n.result[3].startsWith('🔴');body+=`<div class="eia-result ${danger?'danger':''}"><span>${esc(n.result[3])}</span><h2>${esc(n.result[0])}</h2><p><b>Por qué:</b> ${esc(n.result[1])}</p><p><b>Qué hacer ahora:</b> ${esc(n.result[2])}</p>${n.steps?.length?`<div class="solution"><h3>🛠️ Pasos para intentar resolverlo</h3><ol>${n.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}<small>Resultado orientativo. No sustituye una inspección ni mediciones profesionales.</small><button class="eia-start" onclick="diagReport()">📄 Preparar informe para técnico</button><button class="eia-back" onclick="diagnostico()">Nuevo diagnóstico</button></div>`}
else if(n.free){body+=`<textarea id="diagFree" class="eia-textarea" placeholder="Ej.: cuando enciendo el horno salta el diferencial…"></textarea><button class="eia-start" onclick="diagFreeNext()">Continuar →</button>`}
else{body+=`<div class="eia-question-label">Pregunta ${diag.answers.length+1}</div><div class="eia-options">`;n.a.forEach(x=>body+=`<button class="eia-option" onclick="diagChoose(${JSON.stringify(x[0])},${JSON.stringify(x[1])})">${esc(x[0])}</button>`);body+=`</div>`}
if(diag.history.length&&!n.result)body+=`<button class="eia-back" onclick="diagBack()">← Volver a la pregunta anterior</button>`;body+=`</div></div>`;app.innerHTML=head(true)+`<main class="wrap page">${body}</main>`}
function diagFreeNext(){const el=document.getElementById('diagFree');const p=(el?.value||'').trim();if(!p){el?.focus();return}diag.problem=p;diag.answers.push({q:'¿Qué está pasando?',a:p});const low=p.toLowerCase();if(/humo|fuego|chispa|chispas|olor a quemado|olor fuerte a quemado|descarga|me da corriente|agua.*electric|electric.*agua|cable.*expuesto|cable.*pelado|enchufe.*caliente|caliente.*enchufe/.test(low)){diag.node='danger';renderDiag();return}diag.history.push('start');diag.node='classify';diagTree.classify={q:'Para ubicar la avería: ¿afecta a toda la vivienda, a una zona concreta o a un aparato/enchufe?',a:[['Toda la vivienda','wholeHouse'],['Una zona o habitación','zone'],['Un aparato o enchufe','deviceTrip'],['No estoy seguro','tech']]};renderDiag()}
function diagChoose(label,next){diag.history.push(diag.node);diag.answers.push({q:diagTree[diag.node].q,a:label});if(next==='danger'){diag.node='danger';diag.risk=true;renderDiag();return}diag.node=next;renderDiag()}
function diagBack(){if(!diag.history.length)return;diag.node=diag.history.pop();diag.answers.pop();renderDiag()}
function diagReport(){const n=diagTree[diag.node]||{};const r=n.result;const lines=['ELECTRO IA — INFORME DE DIAGNÓSTICO ELÉCTRICO','','Problema inicial: '+(diag.problem||'Selección rápida'),'','Preguntas y respuestas:',...diag.answers.map((x,i)=>(i+1)+'. '+x.q+'\n   Respuesta: '+x.a),'',`Diagnóstico probable: ${r?.[0]||'Revisión profesional recomendada'}`,`Nivel: ${r?.[3]||'Técnico recomendado'}`,'','Qué hacer ahora: '+(r?.[2]||'Solicitar revisión profesional.'),...(n.steps?.length?['','Pasos sugeridos:',...n.steps.map((x,i)=>(i+1)+'. '+x)]:[]),'','Nota: resultado orientativo; no sustituye inspección, mediciones ni reparación profesional.'];const box=prompt('Informe listo para copiar y enviar al técnico:',lines.join('\n'));if(box!==null){} }

function cuadro(){enterView('cuadro');nav('nHome');app.innerHTML=head(true)+`<main class="wrap page"><h1>🛡️ Entender mi cuadro</h1><p class="subtitle">Guía para identificar los mandos principales sin desmontar nada.</p><div class="panel"><h3>⚡ Interruptor general</h3><p>Es uno de los mandos principales de la vivienda. Si está bajado y no hay señales de peligro, ElectroIA puede guiarte para un rearme seguro.</p></div><div class="panel"><h3>🛡️ Diferencial</h3><p>Suele tener un botón <b>TEST</b>. Protege frente a fugas de corriente. Si dispara repetidamente, no hay que puentearlo ni forzarlo.</p></div><div class="panel"><h3>🔌 Automáticos / magnetotérmicos</h3><p>Protegen circuitos concretos. Uno puede corresponder a enchufes, iluminación, cocina u otra zona según cómo esté hecha la instalación.</p></div><div class="panel"><h3>📟 Contador inteligente e ICP</h3><p>En muchos suministros españoles el contador incorpora el control de potencia. Si se supera la potencia contratada, puede interrumpir el suministro aunque no haya un automático bajado en el cuadro.</p><button class="btn" onclick="diagnostico('wholeHouse','No tengo luz y quiero comprobar si puede ser el control de potencia del contador')">🔋 Comprobar pérdida de suministro</button></div><div class="risk"><b>Importante:</b> no abras el cuadro, no retires tapas, no toques cables ni manipules el contador. ElectroIA solo guía comprobaciones accesibles y seguras.</div></main>`}

<script id="electroia-spa-navigation">
let electroView='home';
let electroStack=[];
let electroGoingBack=false;

function enterView(name, reset=false){
  if(reset){
    electroStack=[];
    electroView=name;
    return;
  }
  if(electroGoingBack){
    electroView=name;
    return;
  }
  if(electroView!==name){
    electroStack.push(electroView);
    electroView=name;
  }
}

function goBack(){
  if(electroStack.length===0){
    return home();
  }
  const prev=electroStack.pop();
  electroGoingBack=true;
  electroView=prev;
  try{
    if(prev==='home') home();
    else if(prev==='hogar') hogar();
    else if(prev==='diagnostico') diagnostico();
    else if(prev==='safety') safety();
    else if(prev==='acciones') acciones();
    else if(prev==='consumo') consumo();
    else if(prev==='miCasa') miCasa();
    else if(prev==='cuadro') cuadro();
    else if(prev==='aprender') aprender();
    else if(prev==='prof') prof();
    else if(prev==='pv') pv();
    else if(prev==='projects') projects();
    else if(prev==='favorites') favorites();
    else if(prev==='settings') settings();
    else if(prev==='chat') chat(currentMode||'hogar');
    else home();
  } finally {
    electroGoingBack=false;
  }
}
</script></body></html>
